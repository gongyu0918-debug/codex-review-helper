interface:
  display_name: "Codex Review Helper"
  short_description: "Single-packet read-only code review helper through CodeWhale"
  default_prompt: "Use $codex-review-helper only for one explicit, non-secret review packet through a configured CodeWhale agent CLI. CodeWhale is an independent coding agent like Codex or Claude Code; it was formerly DeepSeek-TUI and is not DeepSeek itself. Use it only after CodeWhale has a configured provider, model, and valid API key. It is for second-pass code review, code recheck, and bug-risk findings only. Do not use it for batches, A/B ablation, model evaluation, prompt/data collection, implementation, full-repo work, or any workflow that sends Codex/GPT output as a corpus. Codex accepts or rejects findings locally and never loops helper output back for correction."
